<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espectroteca IR - Base de Datos de Espectros IR Medio</title>

<!-- Plotly.js para gráficas interactivas -->
<script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>

<style>
:root {
  --bg: #0b0f19;
  --card-bg: #151c2c;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --bd: #2d3748;
  --accent: #38bdf8;
  --accent-alc: #38bdf8;
  --accent-fen: #f43f5e;
  --accent-aci: #10b981;
  --accent-cet: #a855f7;
  --accent-est: #f59e0b;
  --accent-ami: #ec4899;
  --accent-aro: #06b6d4;
  --accent-alk: #84cc16;
  --accent-ete: #eab308;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background-color: var(--bg);
  color: var(--tx);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

.container { max-width: 900px; margin: 0 auto; }

header {
  text-align: center;
  padding: 24px 12px;
  background: radial-gradient(circle at top, #1e293b, var(--card-bg));
  border-radius: 20px;
  border: 1px solid var(--bd);
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

h1 {
  margin: 0;
  font-size: 26px;
  background: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

.sub { font-size: 14px; color: var(--mu); margin-top: 6px; }

/* Buscador y chips */
.search-box {
  width: 100%;
  padding: 14px 18px;
  background: var(--card-bg);
  border: 1px solid var(--bd);
  border-radius: 14px;
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
  margin-bottom: 12px;
}
.search-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
}

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 16px 0;
  -webkit-overflow-scrolling: touch;
}

.chip {
  flex: 0 0 auto;
  padding: 8px 16px;
  border-radius: 30px;
  border: 1px solid var(--bd);
  background: var(--card-bg);
  color: var(--mu);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.chip.on { color: #fff; border-color: var(--accent); background: rgba(56, 189, 248, 0.2); }

/* Tarjetas de compuestos */
.card {
  background: var(--card-bg);
  border: 1px solid var(--bd);
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
}

.card > summary {
  padding: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  list-style: none;
}
.card > summary::-webkit-details-marker { display: none; }

.badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--bd);
}

.nm { flex: 1; font-weight: 600; font-size: 16px; }
.nm small { display: block; font-weight: 400; color: var(--mu); font-size: 13px; }

.body {
  padding: 16px;
  background: #0f172a;
  border-top: 1px solid var(--bd);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 12px 0;
}

th, td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

th { color: var(--accent); font-size: 11px; text-transform: uppercase; }

/* Gráfica Plotly */
.plot-container {
  width: 100%;
  height: 320px;
  margin: 14px 0;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--bd);
}

.img-box {
  margin: 12px 0;
  text-align: center;
  background: #000;
  border-radius: 10px;
  padding: 8px;
  border: 1px dashed var(--bd);
}
.img-box img { max-width: 100%; border-radius: 6px; }

.btn-file {
  display: block;
  text-align: center;
  background: linear-gradient(90deg, #38bdf8, #a855f7);
  color: #fff;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📈 Espectroteca IR - Base de Datos Interactiva</h1>
    <div class="sub" id="sub">Cargando base de datos de 200 espectros...</div>
  </header>

  <input type="search" class="search-box" id="q" placeholder="🔍 Buscar por nombre, número CAS, fórmula o ID..." autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="sub" id="count" style="margin-bottom: 12px;"></div>

  <div id="list"></div>
</div>

<script>
// Lista de 10 grupos funcionales
const G = [
  {code:"ALC", name:"Alcoholes"},
  {code:"FEN", name:"Fenoles"},
  {code:"ACI", name:"Ácidos Carboxílicos"},
  {code:"CET", name:"Cetonas"},
  {code:"EST", name:"Ésteres"},
  {code:"AMI", name:"Amidas"},
  {code:"ARO", name:"Aromáticos"},
  {code:"ALK", name:"Alcanos"},
  {code:"ETE", name:"Éteres"}
];

// Muestra de espectros recopilados con coordenadas X e Y para Plotly
const C = [
  {
    id: "ALC-01", g: "ALC", es: "Metanol", en: "Methanol", f: "CH₄O", tech: "Película líquida", src: "SDBS-3302",
    bands: [
      {nu: 3347, int: "f, ancha", as: "ν O–H libre/asociado"},
      {nu: 2945, int: "f", as: "ν C–H sp³"},
      {nu: 1030, int: "muy f", as: "ν C–O"}
    ],
    // Coordenadas simuladas [X (cm⁻¹), Y (%T)] para renderizar la curva interactiva con Plotly
    spec: {
      x: [4000, 3700, 3347, 3000, 2945, 2800, 2000, 1460, 1030, 800, 400],
      y: [95,   92,   10,   85,   20,   88,   95,   47,   5,    60,  90]
    }
  },
  {
    id: "ALC-03", g: "ALC", es: "1-Propanol", en: "1-Propanol", f: "C₃H₈O", tech: "Solución CCl₄", src: "SDBS-1212",
    bands: [
      {nu: 3637, int: "m, aguda", as: "ν O–H libre"},
      {nu: 3340, int: "f, ancha", as: "ν O–H asociado"},
      {nu: 2964, int: "muy f", as: "ν C–H sp³"},
      {nu: 1054, int: "muy f", as: "ν C–O primario"}
    ],
    spec: {
      x: [4000, 3637, 3340, 3000, 2964, 2800, 1500, 1054, 800, 400],
      y: [95,   46,   26,   80,   4,    85,   60,   10,   75,  90]
    }
  },
  {
    id: "ACI-02", g: "ACI", es: "Ácido acético", en: "Acetic acid", f: "C₂H₄O₂", tech: "Solución CCl₄", src: "SDBS-306",
    bands: [
      {nu: 3000, int: "f, muy ancha", as: "ν O–H asociado (dímero)"},
      {nu: 1715, int: "muy f", as: "ν C=O carbonilo ácido"},
      {nu: 1292, int: "f", as: "ν C–O"}
    ],
    spec: {
      x: [4000, 3500, 3000, 2500, 1715, 1400, 1292, 800, 400],
      y: [95,   90,   20,   70,   4,    60,   15,   70,  90]
    }
  },
  {
    id: "CET-01", g: "CET", es: "Acetona", en: "Acetone", f: "C₃H₆O", tech: "Película líquida", src: "SDBS-319",
    bands: [
      {nu: 1715, int: "muy f", as: "ν C=O cetona no conjugada"},
      {nu: 1363, int: "f", as: "δ C–H metilcetona"},
      {nu: 1223, int: "f", as: "ν C–C(=O)–C"}
    ],
    spec: {
      x: [4000, 3400, 3000, 1715, 1363, 1223, 800, 400],
      y: [95,   92,   80,   4,    13,   12,   85,  90]
    }
  }
];

let state = { g: 'ALL', q: '' };
const byId = {};
C.forEach(c => byId[c.id] = c);

document.getElementById('sub').textContent = `${C.length} compuestos en catálogo | Gráficas en tiempo real activas`;

function renderChips() {
  let h = `<button class="chip on" data-g="ALL">Todos (${C.length})</button>`;
  G.forEach(g => {
    let count = C.filter(c => c.g === g.code).length;
    h += `<button class="chip" data-g="${g.code}">${g.name} (${count})</button>`;
  });
  const el = document.getElementById('chips');
  el.innerHTML = h;
  el.addEventListener('click', e => {
    let b = e.target.closest('.chip');
    if (!b) return;
    state.g = b.dataset.g;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    renderList();
  });
}

function renderList() {
  let q = state.q.toLowerCase();
  let rows = C.filter(c => (state.g === 'ALL' || c.g === state.g) && (!q || (c.es + c.en + c.f + c.id).toLowerCase().includes(q)));
  document.getElementById('count').textContent = `Mostrando ${rows.length} compuesto(s)`;

  document.getElementById('list').innerHTML = rows.map(c => `
    <details class="card" data-id="${c.id}">
      <summary>
        <span class="badge">${c.id}</span>
        <span class="nm">${c.es} <small>${c.en} · ${c.f}</small></span>
      </summary>
    </details>
  `).join('') || '<p class="sub">No se encontraron resultados.</p>';
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderList(); });

document.getElementById('list').addEventListener('toggle', e => {
  let d = e.target;
  if (!d.open || d.dataset.done) return;
  d.dataset.done = '1';
  let c = byId[d.dataset.id];
  let b = document.createElement('div');
  b.className = 'body';

  let savedImg = localStorage.getItem('img_' + c.id);

  let h = `<p class="sub">Técnica: <b>${c.tech}</b> | Registro: <b>${c.src}</b></p>`;
  
  // Tabla de picos
  h += `<table><tr><th>Frecuencia (cm⁻¹)</th><th>Intensidad</th><th>Asignación Vibracional</th></tr>`;
  c.bands.forEach(bd => {
    h += `<tr><td><b>${bd.nu}</b></td><td>${bd.int}</td><td>${bd.as}</td></tr>`;
  });
  h += `</table>`;

  // Contenedor para el gráfico de Plotly.js
  if (c.spec) {
    h += `<div class="plot-container" id="plot_${c.id}"></div>`;
  }

  // Contenedor para la imagen cargada opcional
  h += `<div class="img-box" id="img_box_${c.id}">
          ${savedImg ? `<img src="${savedImg}">` : '<p class="sub">📷 No hay imagen subida aún.</p>'}
        </div>`;

  h += `<label class="btn-file">
          📸 Cargar / Tomar foto de imagen de respaldo
          <input type="file" accept="image/*" style="display:none" onchange="uploadImg('${c.id}', this)">
        </label>`;

  b.innerHTML = h;
  d.appendChild(b);

  // Renderizar la gráfica interactiva Plotly.js
  if (c.spec) {
    setTimeout(() => {
      Plotly.newPlot(`plot_${c.id}`, [{
        x: c.spec.x,
        y: c.spec.y,
        type: 'scatter',
        mode: 'lines',
        line: { color: '#38bdf8', width: 2 }
      }], {
        margin: { t: 30, r: 20, l: 40, b: 40 },
        paper_bgcolor: '#0f172a',
        plot_bgcolor: '#0f172a',
        title: { text: `Espectro IR - ${c.es}`, font: { color: '#f1f5f9', size: 14 } },
        xaxis: { title: 'Número de onda (cm⁻¹)', autorange: 'reversed', color: '#94a3b8', gridcolor: '#1e293b' },
        yaxis: { title: '% Transmitancia', range: [0, 100], color: '#94a3b8', gridcolor: '#1e293b' }
      }, { responsive: true, displayModeBar: false });
    }, 100);
  }
}, true);

window.uploadImg = function(id, input) {
  if (input.files && input.files[0]) {
    let reader = new FileReader();
    reader.onload = function(e) {
      let dataUrl = e.target.result;
      localStorage.setItem('img_' + id, dataUrl);
      document.getElementById('img_box_' + id).innerHTML = `<img src="${dataUrl}">`;
    };
    reader.readAsDataURL(input.files[0]);
  }
};

renderChips();
renderList();
</script>

</body>
</html>
